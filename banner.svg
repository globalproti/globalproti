<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2e5a"/>
      <stop offset="60%" stop-color="#3d3a72"/>
      <stop offset="100%" stop-color="#7368ab"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7368ab" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7368ab" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#2b2e5a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2b2e5a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bg)" rx="12"/>

  <!-- Glow overlays -->
  <rect width="900" height="160" fill="url(#glow)" rx="12"/>
  <rect width="900" height="160" fill="url(#glow2)" rx="12"/>

  <!-- Grid lines -->
  <line x1="0" y1="40"  x2="900" y2="40"  stroke="white" stroke-width="0.4" opacity="0.07"/>
  <line x1="0" y1="80"  x2="900" y2="80"  stroke="white" stroke-width="0.4" opacity="0.07"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="white" stroke-width="0.4" opacity="0.07"/>
  <line x1="180" y1="0" x2="180" y2="160" stroke="white" stroke-width="0.4" opacity="0.07"/>
  <line x1="360" y1="0" x2="360" y2="160" stroke="white" stroke-width="0.4" opacity="0.07"/>
  <line x1="540" y1="0" x2="540" y2="160" stroke="white" stroke-width="0.4" opacity="0.07"/>
  <line x1="720" y1="0" x2="720" y2="160" stroke="white" stroke-width="0.4" opacity="0.07"/>

  <!-- Decorative circles -->
  <circle cx="860" cy="20"  r="90" fill="#7368ab" opacity="0.12"/>
  <circle cx="860" cy="20"  r="55" fill="#7368ab" opacity="0.10"/>
  <circle cx="40"  cy="150" r="75" fill="#2b2e5a" opacity="0.25"/>

  <!-- Animated dots -->
  <circle cx="160" cy="45" r="2.5" fill="#c4bfe8" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="115" r="2" fill="#c4bfe8" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="140" r="1.8" fill="#c4bfe8" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="28" r="1.5" fill="#c4bfe8" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="55" r="2" fill="#c4bfe8" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Main text -->
  <text x="450" y="78" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1" opacity="0.97">GlobalPro</text>

  <!-- Tagline -->
  <text x="450" y="115" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c4bfe8" text-anchor="middle" letter-spacing="7">COSMÉTICOS SOB MEDIDA</text>

  <!-- Accent bars -->
  <rect x="375" y="130" width="150" height="2"   fill="#7368ab" rx="1" opacity="0.9"/>
  <rect x="405" y="135" width="90"  height="1"   fill="#7368ab" rx="1" opacity="0.4"/>
</svg>
